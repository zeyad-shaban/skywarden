controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

joint_trajectory_controller:
  ros__parameters:
    type: velocity_controllers/JointGroupVelocityController
    joints:
      - yaw_base_joint
      - pitch_base_joint
    
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity